name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn -B package -Djava.awt.headless=true -Dmaven.test.skip=true

      - name: Zip target/CoTe
        run: |
          cd target
          zip -r CoTe.zip CoTe

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/CoTe.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
